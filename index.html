<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Capture Component - Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen p-4">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg overflow-hidden">

            <!-- Header -->
            <div class="flex items-center justify-between p-4 border-b border-gray-200">
                <button class="p-2 hover:bg-gray-100 rounded-lg transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
                <h1 class="text-lg font-semibold text-gray-900">Add Coin Photo</h1>
                <div class="w-10"></div>
            </div>

            <!-- Initial State -->
            <div id="initialState" class="flex flex-col items-center justify-center p-8 min-h-[500px]">

                <!-- Camera Icon -->
                <div class="w-32 h-32 bg-gray-200 rounded-full flex items-center justify-center mb-6">
                    <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </div>

                <h2 class="text-xl font-semibold text-gray-900 mb-2">Capture Coin Photo</h2>
                <p class="text-gray-600 text-center mb-6 text-sm max-w-xs">
                    Take a clear photo of your coin's front or back
                </p>

                <!-- Primary Button - Camera -->
                <label for="camera-input" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold cursor-pointer hover:bg-blue-700 transition">
                    Open Camera
                </label>
                <input
                    id="camera-input"
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="handleFileSelect(event)"
                    class="hidden"
                />

                <!-- Secondary Button - Gallery -->
                <label for="gallery-input" class="mt-4 border-2 border-blue-600 text-blue-600 px-8 py-3 rounded-lg font-semibold cursor-pointer hover:bg-blue-50 transition">
                    Choose from Gallery
                </label>
                <input
                    id="gallery-input"
                    type="file"
                    accept="image/*"
                    onchange="handleFileSelect(event)"
                    class="hidden"
                />
            </div>

            <!-- Preview State (hidden initially) -->
            <div id="previewState" class="p-6 min-h-[500px] hidden">
                <img
                    id="previewImage"
                    src=""
                    alt="Preview"
                    class="w-full rounded-lg shadow-md mb-6 object-cover"
                />

                <div class="flex gap-3">
                    <button
                        onclick="handleRetake()"
                        class="flex-1 border-2 border-gray-300 text-gray-700 px-4 py-3 rounded-lg font-semibold hover:bg-gray-50 transition flex items-center justify-center gap-2"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Retake
                    </button>

                    <button
                        onclick="handleUsePhoto()"
                        class="flex-1 bg-green-600 text-white px-4 py-3 rounded-lg font-semibold hover:bg-green-700 transition flex items-center justify-center gap-2"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        Use Photo
                    </button>
                </div>
            </div>

            <!-- Tips Footer -->
            <div id="tipsFooter" class="bg-blue-50 p-4 border-t border-blue-100 text-sm text-blue-800">
                <strong>💡 Tips:</strong> Use good lighting, avoid shadows, center the coin
            </div>

        </div>
    </div>

    <script>
        let currentFile = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                currentFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImage').src = e.target.result;
                    document.getElementById('initialState').classList.add('hidden');
                    document.getElementById('tipsFooter').classList.add('hidden');
                    document.getElementById('previewState').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function handleRetake() {
            currentFile = null;
            document.getElementById('previewImage').src = '';
            document.getElementById('previewState').classList.add('hidden');
            document.getElementById('initialState').classList.remove('hidden');
            document.getElementById('tipsFooter').classList.remove('hidden');
            // Reset file inputs
            document.getElementById('camera-input').value = '';
            document.getElementById('gallery-input').value = '';
        }

        function handleUsePhoto() {
            if (currentFile) {
                alert(`Would proceed to metadata entry with: ${currentFile.name}`);
            }
        }
    </script>
</body>
</html>
