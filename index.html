<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Photo Capture - Obverse & Reverse</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen p-4">
        <div class="max-w-md mx-auto">

            <!-- Header -->
            <div class="bg-white rounded-t-lg shadow-lg p-4 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <button class="p-2 hover:bg-gray-100 rounded-lg transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                    <h1 class="text-lg font-semibold text-gray-900">Add Coin Photos</h1>
                    <div class="w-10"></div>
                </div>
                <p class="text-sm text-gray-600 text-center mt-2">Capture both sides of your coin</p>
            </div>

            <!-- Obverse Section -->
            <div class="bg-white shadow-lg p-6 border-b border-gray-200">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 class="text-lg font-semibold text-gray-900">Obverse (Heads)</h2>
                        <p class="text-xs text-gray-500">Front side of the coin</p>
                    </div>
                    <div id="obverseCheck" class="hidden">
                        <svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                </div>

                <!-- Obverse Initial State -->
                <div id="obverseInitial" class="flex flex-col items-center py-8">
                    <div class="w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center mb-4 border-2 border-blue-200">
                        <svg class="w-12 h-12 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </div>

                    <label for="obverse-camera" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-semibold cursor-pointer hover:bg-blue-700 transition text-sm">
                        Capture Obverse
                    </label>
                    <input
                        id="obverse-camera"
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="handleFileSelect(event, 'obverse')"
                        class="hidden"
                    />

                    <label for="obverse-gallery" class="mt-2 text-blue-600 px-4 py-2 rounded-lg font-medium cursor-pointer hover:bg-blue-50 transition text-sm">
                        Choose from Gallery
                    </label>
                    <input
                        id="obverse-gallery"
                        type="file"
                        accept="image/*"
                        onchange="handleFileSelect(event, 'obverse')"
                        class="hidden"
                    />
                </div>

                <!-- Obverse Preview -->
                <div id="obversePreview" class="hidden">
                    <img
                        id="obverseImage"
                        src=""
                        alt="Obverse preview"
                        class="w-full rounded-lg shadow-md mb-3 object-cover max-h-64"
                    />
                    <button
                        onclick="handleRetake('obverse')"
                        class="w-full border-2 border-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-gray-50 transition text-sm flex items-center justify-center gap-2"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Retake Obverse
                    </button>
                </div>
            </div>

            <!-- Reverse Section -->
            <div class="bg-white shadow-lg p-6 border-b border-gray-200">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 class="text-lg font-semibold text-gray-900">Reverse (Tails)</h2>
                        <p class="text-xs text-gray-500">Back side of the coin</p>
                    </div>
                    <div id="reverseCheck" class="hidden">
                        <svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                </div>

                <!-- Reverse Initial State -->
                <div id="reverseInitial" class="flex flex-col items-center py-8">
                    <div class="w-24 h-24 bg-purple-50 rounded-full flex items-center justify-center mb-4 border-2 border-purple-200">
                        <svg class="w-12 h-12 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </div>

                    <label for="reverse-camera" class="bg-purple-600 text-white px-6 py-2.5 rounded-lg font-semibold cursor-pointer hover:bg-purple-700 transition text-sm">
                        Capture Reverse
                    </label>
                    <input
                        id="reverse-camera"
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onchange="handleFileSelect(event, 'reverse')"
                        class="hidden"
                    />

                    <label for="reverse-gallery" class="mt-2 text-purple-600 px-4 py-2 rounded-lg font-medium cursor-pointer hover:bg-purple-50 transition text-sm">
                        Choose from Gallery
                    </label>
                    <input
                        id="reverse-gallery"
                        type="file"
                        accept="image/*"
                        onchange="handleFileSelect(event, 'reverse')"
                        class="hidden"
                    />
                </div>

                <!-- Reverse Preview -->
                <div id="reversePreview" class="hidden">
                    <img
                        id="reverseImage"
                        src=""
                        alt="Reverse preview"
                        class="w-full rounded-lg shadow-md mb-3 object-cover max-h-64"
                    />
                    <button
                        onclick="handleRetake('reverse')"
                        class="w-full border-2 border-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-gray-50 transition text-sm flex items-center justify-center gap-2"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Retake Reverse
                    </button>
                </div>
            </div>

            <!-- Continue Button -->
            <div id="continueSection" class="bg-white rounded-b-lg shadow-lg p-4 hidden">
                <button
                    onclick="handleContinue()"
                    class="w-full bg-green-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-700 transition flex items-center justify-center gap-2"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    Continue
                </button>
                <p class="text-xs text-gray-500 text-center mt-2">
                    <span id="photoCount">0</span> photo(s) captured
                </p>
            </div>

            <!-- Tips -->
            <div class="bg-blue-50 rounded-lg p-4 mt-4 text-sm text-blue-800">
                <strong>💡 Tips:</strong> Use good lighting, avoid shadows, center the coin in frame
            </div>

        </div>
    </div>

    <script>
        let obverseFile = null;
        let reverseFile = null;

        function handleFileSelect(event, side) {
            const file = event.target.files[0];
            if (file) {
                if (side === 'obverse') {
                    obverseFile = file;
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.getElementById('obverseImage').src = e.target.result;
                        document.getElementById('obverseInitial').classList.add('hidden');
                        document.getElementById('obversePreview').classList.remove('hidden');
                        document.getElementById('obverseCheck').classList.remove('hidden');
                        updateContinueButton();
                    };
                    reader.readAsDataURL(file);
                } else {
                    reverseFile = file;
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.getElementById('reverseImage').src = e.target.result;
                        document.getElementById('reverseInitial').classList.add('hidden');
                        document.getElementById('reversePreview').classList.remove('hidden');
                        document.getElementById('reverseCheck').classList.remove('hidden');
                        updateContinueButton();
                    };
                    reader.readAsDataURL(file);
                }
            }
        }

        function handleRetake(side) {
            if (side === 'obverse') {
                obverseFile = null;
                document.getElementById('obverseImage').src = '';
                document.getElementById('obversePreview').classList.add('hidden');
                document.getElementById('obverseInitial').classList.remove('hidden');
                document.getElementById('obverseCheck').classList.add('hidden');
                document.getElementById('obverse-camera').value = '';
                document.getElementById('obverse-gallery').value = '';
            } else {
                reverseFile = null;
                document.getElementById('reverseImage').src = '';
                document.getElementById('reversePreview').classList.add('hidden');
                document.getElementById('reverseInitial').classList.remove('hidden');
                document.getElementById('reverseCheck').classList.add('hidden');
                document.getElementById('reverse-camera').value = '';
                document.getElementById('reverse-gallery').value = '';
            }
            updateContinueButton();
        }

        function updateContinueButton() {
            const count = (obverseFile ? 1 : 0) + (reverseFile ? 1 : 0);
            const continueSection = document.getElementById('continueSection');
            const photoCount = document.getElementById('photoCount');

            if (count > 0) {
                continueSection.classList.remove('hidden');
                photoCount.textContent = count;
            } else {
                continueSection.classList.add('hidden');
            }
        }

        function handleContinue() {
            const photos = [];
            if (obverseFile) photos.push(`Obverse: ${obverseFile.name}`);
            if (reverseFile) photos.push(`Reverse: ${reverseFile.name}`);

            alert(`Proceeding with:\n${photos.join('\n')}\n\nNext: Crop/rotate tools and metadata entry`);
        }
    </script>
</body>
</html>
